[project]
name = "groundwork"
version = "0.1.0"
description = "Turns a raw discovery conversation into the proposal a client would actually pay for."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
groundwork = "groundwork.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["groundwork*"]
